<!-- The Products / probably gonna need to have this in its own component -->
<div class="container mt-4">
  <h2 class="text-center mb-4">Products</h2>
 
  <!-- Used Bootstrap to for the styling of the cards (way easier than having to struggle with css😉)-->
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let product of products">
      <div class="card h-100 shadow-sm">
        <img
          [src]="product.image"
          class="card-img-top p-3"
          alt="{{ product.title }}"
          style="height: 200px; object-fit: contain;"
        />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title text-truncate">{{ product.title }}</h5>
          <p class="card-text text-muted small">
            {{ product.description | slice: 0: 60 }}...
          </p>
          <p class="fw-bold mt-auto">Price: ${{ product.price }}</p>
          <button class="btn btn-primary mt-2 w-100">Select</button>
        </div>
      </div>
    </div>
  </div>
</div>
